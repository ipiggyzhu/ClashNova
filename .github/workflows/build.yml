name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 全平台可跑的验证: 前端类型检查/构建 + nova-core 纯逻辑测试
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: 安装前端依赖
        run: npm ci

      - name: 前端构建(tsc + vite)
        run: npm run build

      - name: nova-core 单元测试
        run: cargo test -p nova-core --manifest-path crates/nova-core/Cargo.toml

  # Windows 安装包: 仅 tag v* 或手动触发
  release:
    runs-on: windows-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: 安装前端依赖
        run: npm ci

      - name: 生成应用图标
        run: node scripts/gen-icons.mjs

      - name: 拉取 mihomo 内核
        run: node scripts/fetch-mihomo.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tauri 构建(msi + nsis)
        shell: pwsh
        run: |
          npm run tauri build 2>&1 | Tee-Object -FilePath build.log
          exit $LASTEXITCODE

      - name: 失败时公开构建日志(便于离线排查)
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -E "^error(\[E[0-9]+\])?(:|\b)" -A 8 build.log | head -120 | \
            sed ':a;N;$!ba;s/\n/%0A/g' | cut -c1-3800 | \
            xargs -0 -I{} echo "::error::{}" || true
          gh release delete buildlog -y --cleanup-tag 2>/dev/null || true
          gh release create buildlog build.log --title "CI build log (debug)" \
            --notes "自动上传的失败构建日志" --prerelease

      - name: 上传 MSI 工件
        uses: actions/upload-artifact@v4
        with:
          name: ClashNova-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: 上传 NSIS 安装包工件
        uses: actions/upload-artifact@v4
        with:
          name: ClashNova-nsis-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: 发布安装包到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "ClashNova $GITHUB_REF_NAME" \
            --notes "Windows 安装包：NSIS(.exe) 与 MSI 两种格式，任选其一安装。" \
            2>/dev/null || true
          gh release upload "$GITHUB_REF_NAME" \
            src-tauri/target/release/bundle/msi/*.msi \
            src-tauri/target/release/bundle/nsis/*.exe \
            --clobber
