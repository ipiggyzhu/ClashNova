name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run nova-core tests
        run: cargo test -p nova-core --manifest-path crates/nova-core/Cargo.toml

      - name: Remove debug build-log release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete buildlog -y --cleanup-tag || true

  release:
    runs-on: windows-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Clean Rust build cache
        run: cargo clean

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate app icons
        run: node scripts/gen-icons.mjs

      - name: Fetch mihomo core
        run: node scripts/fetch-mihomo.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build service helpers
        shell: pwsh
        run: |
          cargo build --release --bin clashnova-service
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          cargo build --release --bin clashnova-service-install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          cargo build --release --bin clashnova-service-uninstall
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Get-ChildItem target/release/clashnova-service*.exe | Select-Object Name, Length

      - name: Build Tauri NSIS installer
        shell: pwsh
        run: |
          npm run tauri build -- --bundles nsis 2>&1 | Tee-Object -FilePath build-nsis.log
          exit $LASTEXITCODE

      - name: Build Tauri MSI installer
        id: build_msi
        shell: pwsh
        run: |
          $env:RUST_BACKTRACE = "1"
          $env:RUST_LOG = "tauri_bundler=trace,tauri_cli=debug"
          npm run tauri build -- --bundles msi --verbose 2>&1 | Tee-Object -FilePath build-msi.log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            "msi_failed=true" >> $env:GITHUB_OUTPUT
            "msi_exit_code=$exitCode" >> $env:GITHUB_OUTPUT
            Write-Warning "MSI build failed with exit code $exitCode; NSIS release will still be published."
          } else {
            "msi_failed=false" >> $env:GITHUB_OUTPUT
            "msi_exit_code=0" >> $env:GITHUB_OUTPUT
          }

      - name: Upload MSI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ClashNova-msi-diagnostics
          path: |
            build-msi.log
            target/release/wix/**/*.wxs
            target/release/wix/**/*.wxl
          if-no-files-found: warn

      - name: Publish MSI diagnostic log
        if: steps.build_msi.outputs.msi_failed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "MSI build failed for ${GITHUB_SHA}."
            echo
            cat build-msi.log
            if [[ -d target/release/wix ]]; then
              echo
              echo "Generated WiX sources:"
              find target/release/wix -type f \( -name '*.wxs' -o -name '*.wxl' \) -print -exec sh -c 'echo "----- $1 -----"; sed -n "1,260p" "$1"' sh {} \;
            fi
          } > msi-diagnostics.log

          grep -E "LGHT|ICE|error|failed" -A 8 msi-diagnostics.log | head -160 | \
            sed ':a;N;$!ba;s/\n/%0A/g' | cut -c1-3800 | \
            xargs -0 -I{} echo "::warning::{}" || true
          gh release delete buildlog -y --cleanup-tag 2>/dev/null || true
          gh release create buildlog msi-diagnostics.log --title "CI MSI diagnostic log" \
            --notes "Automatic upload of the MSI diagnostic log." --prerelease

      - name: Publish build log on failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat build-*.log > build.log 2>/dev/null || true
          grep -E "^error(\[E[0-9]+\])?(:|\b)" -A 8 build.log | head -120 | \
            sed ':a;N;$!ba;s/\n/%0A/g' | cut -c1-3800 | \
            xargs -0 -I{} echo "::error::{}" || true
          gh release delete buildlog -y --cleanup-tag 2>/dev/null || true
          gh release create buildlog build.log --title "CI build log (debug)" \
            --notes "Automatic upload of the failed build log." --prerelease

      - name: Upload Windows installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ClashNova-windows-installers
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Publish installers to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release_tag="$GITHUB_REF_NAME"
          else
            version="$(node -e "console.log(require('./src-tauri/tauri.conf.json').version)")"
            release_tag="v${version}"
          fi

          gh release create "$release_tag" \
            --title "ClashNova $release_tag" \
            --notes "Windows installers produced by the latest release workflow." \
            --latest \
            2>/dev/null || true

          installers=()
          for file in target/release/bundle/nsis/*.exe target/release/bundle/msi/*.msi; do
            if [[ -f "$file" ]]; then
              installers+=("$file")
            fi
          done

          if [[ ${#installers[@]} -eq 0 ]]; then
            echo "No installer files were produced." >&2
            exit 1
          fi

          gh release upload "$release_tag" "${installers[@]}" --clobber
