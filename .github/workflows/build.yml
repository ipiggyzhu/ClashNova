name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# 同时推送 main 与 tag(如发版时)会触发两个 release job, 都对同一个 vX.Y.Z release
# 做 create/clobber, 互相使对方的 release ID 失效, 导致 asset 上传 404。
# 用同一并发组把发布构建串行化; cancel-in-progress: false 保证正在上传的构建不被中途取消。
concurrency:
  group: release-build
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run nova-core tests
        run: cargo test -p nova-core --manifest-path crates/nova-core/Cargo.toml

      - name: Remove debug build-log release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete buildlog -y --cleanup-tag || true

  release:
    runs-on: windows-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Clean Rust build cache
        run: cargo clean

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate app icons
        run: node scripts/gen-icons.mjs

      - name: Fetch mihomo core
        run: node scripts/fetch-mihomo.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build service helpers
        shell: pwsh
        env:
          CLASHNOVA_ALLOW_PLACEHOLDER_SERVICE_RESOURCES: 1
        run: |
          cargo build --release --bin clashnova-service
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          cargo build --release --bin clashnova-service-install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          cargo build --release --bin clashnova-service-uninstall
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Get-ChildItem target/release/clashnova-service*.exe | Select-Object Name, Length

      - name: Sign bundled Windows binaries
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          $targets = @(
            'src-tauri/binaries/mihomo-x86_64-pc-windows-msvc.exe',
            'target/release/clashnova-service.exe',
            'target/release/clashnova-service-install.exe',
            'target/release/clashnova-service-uninstall.exe'
          )
          foreach ($target in $targets) {
            if (Test-Path -LiteralPath $target) {
              .\scripts\sign-windows.ps1 $target
            } else {
              Write-Host "Skipping missing signing target: $target"
            }
          }

      - name: Prepare bundled service resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/resources | Out-Null
          Copy-Item target/release/clashnova-service.exe src-tauri/resources/clashnova-service.exe -Force
          Copy-Item target/release/clashnova-service-install.exe src-tauri/resources/clashnova-service-install.exe -Force
          Copy-Item target/release/clashnova-service-uninstall.exe src-tauri/resources/clashnova-service-uninstall.exe -Force

          $resources = @(
            'src-tauri/resources/clashnova-service.exe',
            'src-tauri/resources/clashnova-service-install.exe',
            'src-tauri/resources/clashnova-service-uninstall.exe'
          )
          foreach ($resource in $resources) {
            $item = Get-Item -LiteralPath $resource -ErrorAction Stop
            if ($item.Length -le 4096) {
              throw "Bundled service resource looks invalid: $resource ($($item.Length) bytes)"
            }
          }
          Get-ChildItem src-tauri/resources/clashnova-service*.exe | Select-Object Name, Length

      - name: Validate NSIS hook PowerShell
        shell: pwsh
        run: |
          $content = Get-Content -LiteralPath src-tauri/nsis-hooks.nsh -Raw
          $matches = [regex]::Matches(
            $content,
            '-Command "& \{ (?<script>.*?) \}"',
            [System.Text.RegularExpressions.RegexOptions]::Singleline
          )
          if ($matches.Count -lt 2) {
            throw "Expected at least 2 PowerShell hook commands, found $($matches.Count)."
          }
          foreach ($match in $matches) {
            $script = $match.Groups['script'].Value.Replace('$$', '$')
            [scriptblock]::Create($script) | Out-Null
          }

      - name: Build Tauri NSIS installer
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          npm run tauri build -- --bundles nsis 2>&1 | Tee-Object -FilePath build-nsis.log
          exit $LASTEXITCODE

      - name: Sign Windows installers
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          $patterns = @(
            'target/release/bundle/nsis/*.exe'
          )
          foreach ($pattern in $patterns) {
            Get-ChildItem -Path $pattern -ErrorAction SilentlyContinue | ForEach-Object {
              .\scripts\sign-windows.ps1 $_.FullName
            }
          }

      - name: Publish build log on failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat build-*.log > build.log 2>/dev/null || true
          if [[ ! -s build.log ]]; then
            {
              echo "Build failed before bundle logs were produced."
              echo "commit: ${GITHUB_SHA}"
              echo "workflow: ${GITHUB_RUN_ID}"
            } > build.log
          fi
          grep -E "^error(\[E[0-9]+\])?(:|\b)" -A 8 build.log | head -120 | \
            sed ':a;N;$!ba;s/\n/%0A/g' | cut -c1-3800 | \
            xargs -0 -I{} echo "::error::{}" || true
          gh release delete buildlog -y --cleanup-tag 2>/dev/null || true
          gh release create buildlog build.log --title "CI build log (debug)" \
            --notes "Automatic upload of the failed build log." --prerelease

      - name: Publish installers to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release_tag="$GITHUB_REF_NAME"
          else
            version="$(node -e "console.log(require('./src-tauri/tauri.conf.json').version)")"
            release_tag="v${version}"
          fi

          gh release create "$release_tag" \
            --title "ClashNova $release_tag" \
            --notes "Windows NSIS installer produced by the latest release workflow." \
            --latest \
            2>/dev/null || true

          installers=()
          for file in target/release/bundle/nsis/*.exe; do
            if [[ -f "$file" ]]; then
              installers+=("$file")
            fi
          done

          if [[ ${#installers[@]} -eq 0 ]]; then
            echo "No installer files were produced." >&2
            exit 1
          fi

          gh release upload "$release_tag" "${installers[@]}" --clobber

  release-linux:
    runs-on: ubuntu-latest
    # 依赖 Windows release 先建好 GitHub Release 对象, 避免两个 job 并行
    # 各自 create/clobber 同一 tag 导致 release ID 互相失效、asset 上传 404。
    needs: release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libdbus-1-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate app icons
        run: node scripts/gen-icons.mjs

      - name: Fetch mihomo Linux core
        run: node scripts/fetch-mihomo-linux.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Tauri .deb (primary, must succeed)
        run: npm run tauri build -- --bundles deb 2>&1 | tee build-linux-deb.log

      - name: Build Tauri AppImage (best-effort)
        continue-on-error: true
        run: npm run tauri build -- --bundles appimage 2>&1 | tee build-linux-appimage.log

      - name: Publish Linux bundles to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release_tag="$GITHUB_REF_NAME"
          else
            version="$(node -e "console.log(require('./src-tauri/tauri.conf.json').version)")"
            release_tag="v${version}"
          fi

          bundles=()
          while IFS= read -r -d '' file; do
            bundles+=("$file")
          done < <(find src-tauri/target/release/bundle -type f \
            \( -name '*.deb' -o -name '*.AppImage' \) -print0)

          if [[ ${#bundles[@]} -eq 0 ]]; then
            echo "No Linux bundles were produced." >&2
            exit 1
          fi

          printf 'Publishing: %s\n' "${bundles[@]}"
          gh release upload "$release_tag" "${bundles[@]}" --clobber
