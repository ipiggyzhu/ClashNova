name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  # 全平台可跑的验证: 前端类型检查/构建 + nova-core 纯逻辑测试
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: 安装前端依赖
        run: npm ci

      - name: 前端构建(tsc + vite)
        run: npm run build

      - name: nova-core 单元测试
        run: cargo test -p nova-core --manifest-path crates/nova-core/Cargo.toml

  # Windows 安装包: 仅 tag v* 或手动触发
  release:
    runs-on: windows-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: 安装前端依赖
        run: npm ci

      - name: 生成应用图标
        run: node scripts/gen-icons.mjs

      - name: 拉取 mihomo 内核
        run: node scripts/fetch-mihomo.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tauri 构建(msi + nsis)
        run: npm run tauri build

      - name: 上传 MSI 工件
        uses: actions/upload-artifact@v4
        with:
          name: ClashNova-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: 上传 NSIS 安装包工件
        uses: actions/upload-artifact@v4
        with:
          name: ClashNova-nsis-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
