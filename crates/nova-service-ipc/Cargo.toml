[package]
name = "nova-service-ipc"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["sync", "io-util", "net", "time"] }
anyhow = "1.0"
log = "0.4"
once_cell = "1.21"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
] }

[features]
client = []
server = []
