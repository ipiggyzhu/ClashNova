[package]
name = "nova-core"
version = "2.0.0"
edition = "2021"
description = "ClashNova 纯逻辑层:订阅解析 / 深合并 / 运行时配置生成"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
base64 = "0.22"
urlencoding = "2"
thiserror = "2"
boa_engine = "0.21.1"
