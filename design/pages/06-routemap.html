<style>
#page-routemap .rm-card{overflow:hidden}
#page-routemap .rm-priv{font-size:11.5px;color:var(--text-2);margin-left:6px}

/* ---- 地图区 ---- */
#page-routemap .rm-map{position:relative;height:540px;background:var(--bg-deep)}
#page-routemap .rm-map > svg{position:absolute;inset:0;width:100%;height:100%;display:block}
#page-routemap .rm-land{fill:var(--card);stroke:var(--line-2);stroke-width:1;stroke-linejoin:round}
#page-routemap .rm-country{fill:var(--text-3);font-size:11px;font-weight:500;letter-spacing:3px;
  text-anchor:middle;opacity:.8;text-transform:uppercase}
#page-routemap .rm-country.big{font-size:28px;font-weight:600;letter-spacing:10px;opacity:.5}
#page-routemap .rm-city{fill:var(--text-2);font-size:14px;font-weight:600;letter-spacing:.2px}
#page-routemap .rm-city.origin{fill:var(--green)}
#page-routemap .rm-arc{fill:none;stroke-linecap:round}

/* ---- 浮层统计 ---- */
#page-routemap .rm-overlay{position:absolute;top:14px;left:14px;min-width:172px;padding:10px 12px 11px;
  background:color-mix(in srgb,var(--card) 80%,transparent);border:1px solid var(--line);
  border-radius:var(--radius-sm);backdrop-filter:blur(10px)}
#page-routemap .rm-ov-title{font-size:10.5px;font-weight:600;color:var(--text-3);letter-spacing:1px;margin-bottom:7px}
#page-routemap .rm-ov-row{display:flex;align-items:baseline;justify-content:space-between;gap:18px;
  font-size:11px;color:var(--text-3);line-height:1.9}
#page-routemap .rm-ov-row b{font-size:11.5px;font-weight:600;color:var(--text)}
#page-routemap .rm-stamp{position:absolute;right:14px;bottom:12px;font-size:10.5px;color:var(--text-3);
  display:flex;align-items:center;gap:5px}
#page-routemap .rm-stamp i{width:5px;height:5px;border-radius:50%;background:var(--green);flex-shrink:0}

/* ---- 图例 ---- */
#page-routemap .rm-legend{display:flex;align-items:center;gap:16px;padding:11px 16px;
  border-top:1px solid var(--line);font-size:11.5px;color:var(--text-2)}
#page-routemap .rm-lg-cap{font-size:11px;color:var(--text-3);flex-shrink:0}
#page-routemap .lg-it{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
#page-routemap .lg-it i{width:18px;height:3px;border-radius:2px;flex-shrink:0}
#page-routemap .lg-it b{font-weight:600;font-size:11px;color:var(--text-3)}
#page-routemap .lg-it.dim{color:var(--text-3)}
#page-routemap .rm-lw{margin-left:auto;display:inline-flex;align-items:center;gap:7px;
  font-size:11px;color:var(--text-3);flex-shrink:0}
#page-routemap .rm-lw i{width:14px;border-radius:2px;background:var(--text-3);opacity:.7;flex-shrink:0}
</style>
<section class="page" id="page-routemap" data-title="路由地图">

  <div class="card rm-card">
    <div class="card-head">
      <span class="card-ic" style="color:var(--orange)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4L3.5 6v14L9 18l6 2 5.5-2V4L15 6 9 4z"/><path d="M9 4v14"/><path d="M15 6v14"/></svg></span>

          <button class="seg-item">今日</button>
          <button class="seg-item on">本月</button>
          <button class="seg-item">上月</button>
        </div>
        <span class="rm-priv">隐私模式</span>
        <div class="toggle"><div class="knob"></div></div>

          <path class="rm-arc" d="M644 242 Q745 106 925 169" stroke-width="1.8"  opacity=".72"/>
          <path class="rm-arc" d="M644 242 Q754 93 928 172"  stroke-width="1.6"  opacity=".58"/>

          <use href="#rm-plane" transform="translate(728 173) rotate(-24)"/>
          <use href="#rm-plane" transform="translate(793 138) rotate(-8)"/>
          <use href="#rm-plane" transform="translate(822 144) rotate(2)"/>
          <use href="#rm-plane" transform="translate(750 186) rotate(-9)"/>

          <circle cx="644" cy="242" r="2"   fill="#fff" opacity=".9"/>

        <g>
          <text class="rm-city" x="938" y="177">Tokyo</text>
          <text class="rm-city" x="877" y="201">Osaka</text>
          <text class="rm-city" x="740" y="157" text-anchor="end">Seoul</text>
          <text class="rm-city" x="580" y="343">Hong Kong</text>
          <text class="rm-city" x="483" y="511">Singapore</text>
        </g>
      </svg>

      <!-- 浮层统计 -->
      <div class="rm-overlay">
        <div class="rm-ov-title">本月概览</div>
        <div class="rm-ov-row"><span>出口流量</span><b class="num">286.4 GB</b></div>
        <div class="rm-ov-row"><span>代理连接</span><b class="num">382,415 次</b></div>
        <div class="rm-ov-row"><span>活跃航线</span><b class="num">12 条 · 5 城</b></div>
        <div class="rm-ov-row"><span>平均延迟</span><b class="num">64 ms</b></div>
      </div>
      <div class="rm-stamp"><i></i>6 月 1 日 – 6 月 10 日 · 更新于 14:32:08</div>
    </div>

    <!-- 图例 -->
    <div class="rm-legend">
      <span class="rm-lg-cap">线色 = 代理组</span>
      <span class="lg-it"><i style="background:#FF9F0A"></i>Streaming<b class="num">142.6 GB</b></span>

      <span class="rm-lw"><i style="height:1px"></i><i style="height:2.5px"></i><i style="height:4px"></i>线宽 = 流量大小</span>

</section>
