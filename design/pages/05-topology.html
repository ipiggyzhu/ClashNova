<style>
  #page-topology .topo-card{display:flex;flex-direction:column;height:620px;padding:0;overflow:hidden}
  #page-topology .topo-card .card-head{flex:none}
  #page-topology .topo-wrap{flex:1;min-height:0;padding:10px 16px 4px}
  #page-topology .topo-svg{width:100%;height:100%;display:block}
  #page-topology .topo-svg text{font-size:12px;font-weight:500;fill:var(--text)}
  #page-topology .topo-svg text.sub{font-size:10px;font-weight:400;fill:var(--text-3);font-variant-numeric:tabular-nums;letter-spacing:.2px}
  #page-topology .topo-legend{flex:none;display:flex;align-items:center;gap:20px;padding:11px 18px;border-top:1px solid var(--line);font-size:11px;color:var(--text-2)}
  #page-topology .topo-legend .lg{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  #page-topology .topo-legend .lg i{width:8px;height:8px;border-radius:50%;flex:none}
  #page-topology .topo-legend .lg-hint{margin-left:auto;color:var(--text-3);font-size:10.5px}
  #page-topology .card-actions .icon-btn svg{width:14px;height:14px}
</style>
