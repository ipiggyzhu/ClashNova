<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClashNova v2 · 高保真设计稿</title>
<style>
/* ============ 设计令牌 ============ */
:root{
  --bg:#161618; --bg-deep:#101012; --card:#232326; --card-2:#2a2a2e; --card-3:#313136;
  --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.12);
  --text:#ececf0; --text-2:#9b9ba3; --text-3:#6e6e76;
  --accent:#0A84FF; --accent-dim:rgba(10,132,255,.14);
  --green:#32D74B; --red:#FF453A; --orange:#FF9F0A; --yellow:#FFD60A;
  --purple:#BF5AF2; --cyan:#64D2FF; --pink:#FF375F; --teal:#40C8E0;
  --radius:12px; --radius-sm:8px;
  --shadow:0 8px 28px rgba(0,0,0,.36);
  --sans:-apple-system,"SF Pro Display","SF Pro Text","Segoe UI Variable Display","Segoe UI","PingFang SC","Microsoft YaHei UI",sans-serif;
  --mono:"SF Mono","Cascadia Code","JetBrains Mono",Consolas,monospace;
}
[data-theme="light"]{
  --bg:#f2f2f6; --bg-deep:#e9e9ee; --card:#ffffff; --card-2:#f5f5f8; --card-3:#ececf1;
  --line:rgba(0,0,0,.08); --line-2:rgba(0,0,0,.14);
  --text:#1c1c1e; --text-2:#6e6e76; --text-3:#9b9ba3;
  --accent-dim:rgba(10,132,255,.10);
  --shadow:0 8px 28px rgba(0,0,0,.10);
}
/* ============ 基础 ============ */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg-deep);color:var(--text);
  font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
svg{display:block}

/* ============ 应用框架 ============ */
.app{display:flex;height:100vh;background:var(--bg)}
/* ---- 侧边栏 ---- */
.sidebar{width:210px;flex-shrink:0;background:var(--bg-deep);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:14px 10px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px}
.brand-logo{width:30px;height:30px;border-radius:9px;flex-shrink:0;
  background:linear-gradient(135deg,#0A84FF,#64D2FF);display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(10,132,255,.35)}
.brand-logo svg{width:17px;height:17px;stroke:#fff;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.brand-name{font-size:15px;font-weight:700;letter-spacing:.2px}
.brand-ver{font-size:10px;color:var(--text-3);font-family:var(--mono)}
.nav{flex:1;overflow-y:auto}
.nav-group{margin-bottom:6px}
.nav-title{font-size:10px;font-weight:600;color:var(--text-3);text-transform:uppercase;
  letter-spacing:.8px;padding:10px 10px 4px}
.nav-item{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:var(--radius-sm);
  color:var(--text-2);cursor:pointer;user-select:none;font-weight:500;margin-bottom:1px;
  transition:background .15s,color .15s}
.nav-item svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.8;fill:none;
  stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.nav-item:hover{background:var(--card);color:var(--text)}
.nav-item.on{background:var(--card-2);color:var(--accent)}
.side-foot{border-top:1px solid var(--line);padding:10px 8px 2px;margin-top:8px}
.kernel-chip{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--radius-sm);
  background:var(--card)}
.kernel-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--green);
  box-shadow:0 0 6px var(--green);flex-shrink:0}
.kernel-chip b{font-size:11.5px;font-weight:600}
.kernel-chip span{font-size:10px;color:var(--text-3);font-family:var(--mono)}

/* ---- 主区 ---- */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:52px;flex-shrink:0;display:flex;align-items:center;gap:14px;
  padding:0 14px 0 20px;border-bottom:1px solid var(--line)}
.topbar h1{font-size:15px;font-weight:700;flex-shrink:0}
.topbar .spacer{flex:1}
.icon-btn{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  color:var(--text-2);cursor:pointer;border:none;background:transparent;transition:background .15s}
.icon-btn:hover{background:var(--card-2);color:var(--text)}
.icon-btn svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.8;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.win-ctrl{display:flex;margin-left:4px}
.win-ctrl button{width:38px;height:30px;border:none;background:transparent;color:var(--text-3);
  display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:6px}
.win-ctrl button:hover{background:var(--card-2);color:var(--text)}
.win-ctrl button.close:hover{background:var(--red);color:#fff}
.win-ctrl svg{width:11px;height:11px;stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round}
.content{flex:1;overflow-y:auto;padding:18px 20px 28px;scroll-behavior:smooth}
.page{display:none;max-width:1180px;margin:0 auto;animation:pagein .25s ease}
.page.on{display:block}
@keyframes pagein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ============ 通用组件 ============ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}
.card-head{display:flex;align-items:center;gap:9px;padding:13px 16px;border-bottom:1px solid var(--line)}
.card-head h3{font-size:13px;font-weight:600;flex-shrink:0}
.card-head .card-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.card-ic{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,currentColor 14%,transparent);flex-shrink:0}
.card-ic svg{width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.card-body{padding:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}

.seg{display:inline-flex;background:var(--card-2);border:1px solid var(--line);
  border-radius:9px;padding:2px;gap:2px}
.seg-item{border:none;background:transparent;color:var(--text-2);font-size:12px;font-weight:500;
  padding:4px 12px;border-radius:7px;cursor:pointer;font-family:var(--sans);transition:all .15s;white-space:nowrap}
.seg-item:hover{color:var(--text)}
.seg-item.on{background:var(--card-3);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.25)}
[data-theme="light"] .seg-item.on{background:#fff}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);
  background:var(--card-2);color:var(--text);font-size:12px;font-weight:500;font-family:var(--sans);
  padding:5px 12px;border-radius:8px;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn:hover{background:var(--card-3)}
.btn svg{width:13px;height:13px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.btn-primary{background:var(--accent);border-color:transparent;color:#fff}
.btn-primary:hover{background:#2b94ff}
.btn-danger{color:var(--red)}
.btn-sm{padding:3px 9px;font-size:11.5px}

.badge{display:inline-flex;align-items:center;font-family:var(--mono);font-size:10.5px;font-weight:600;
  padding:1.5px 7px;border-radius:20px;line-height:1.5}
.b-green{color:var(--green);background:rgba(50,215,75,.13)}
.b-yellow{color:var(--yellow);background:rgba(255,214,10,.13)}
.b-orange{color:var(--orange);background:rgba(255,159,10,.13)}
.b-red{color:var(--red);background:rgba(255,69,58,.13)}
.b-gray{color:var(--text-3);background:var(--card-2)}
.b-blue{color:var(--accent);background:var(--accent-dim)}
.b-purple{color:var(--purple);background:rgba(191,90,242,.13)}
.b-cyan{color:var(--cyan);background:rgba(100,210,255,.13)}
.chip{display:inline-flex;align-items:center;font-size:10.5px;font-weight:600;padding:1.5px 8px;
  border-radius:6px;background:var(--card-2);color:var(--text-2);border:1px solid var(--line)}

.stat-num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:22px;font-weight:700;line-height:1.2}
.stat-label{font-size:11px;color:var(--text-2);display:flex;align-items:center;gap:5px}
.stat-label svg{width:12px;height:12px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}

.toggle{width:38px;height:22px;border-radius:11px;background:var(--card-3);position:relative;
  cursor:pointer;transition:background .2s;flex-shrink:0;border:1px solid var(--line)}
.toggle .knob{width:18px;height:18px;border-radius:50%;background:#fff;position:absolute;top:1px;left:1px;
  transition:left .2s;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.toggle.on{background:var(--green);border-color:transparent}
.toggle.on .knob{left:17px}

.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;font-size:10.5px;font-weight:600;color:var(--text-3);text-transform:uppercase;
  letter-spacing:.5px;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{transition:background .12s}
.tbl tbody tr:hover{background:var(--card-2)}

.input{background:var(--card-2);border:1px solid var(--line);border-radius:8px;color:var(--text);
  font-size:12.5px;font-family:var(--sans);padding:6px 11px;outline:none;transition:border .15s}
.input:focus{border-color:var(--accent)}
.input::placeholder{color:var(--text-3)}
.select{background:var(--card-2);border:1px solid var(--line);border-radius:8px;color:var(--text);
  font-size:12px;font-family:var(--sans);padding:5px 9px;outline:none;cursor:pointer}
.search-wrap{position:relative;display:inline-flex;align-items:center}
.search-wrap svg{position:absolute;left:9px;width:13px;height:13px;stroke:var(--text-3);
  stroke-width:2;fill:none;stroke-linecap:round}
.search-wrap .input{padding-left:28px}

.set-row{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:none}
.set-row .set-info{flex:1;min-width:0}
.set-row h4{font-size:12.5px;font-weight:600}
.set-row p{font-size:11px;color:var(--text-3);margin-top:1px}

.spark{position:relative}
.bar-col{background:var(--card-3);border-radius:3px 3px 0 0;transition:background .15s}
</style>
</head>
<body>
<div class="app">
  <!-- ================= 侧边栏 ================= -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo"><svg viewBox="0 0 24 24"><path d="M5 19V5l9 14h5V5"/></svg></div>
      <div><div class="brand-name">ClashNova</div><div class="brand-ver">v2.0.0</div></div>
    </div>
    <nav class="nav">
      <div class="nav-group">
        <div class="nav-title">概览</div>
        <div class="nav-item on" data-page="dashboard"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>仪表盘</div>
        <div class="nav-item" data-page="traffic"><svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 3 6-8"/><path d="M16 6h4v4"/></svg>流量统计</div>
        <div class="nav-item" data-page="connections"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2.2"/><circle cx="19" cy="6" r="2.2"/><circle cx="19" cy="18" r="2.2"/><path d="M7 11l10-4M7 13l10 4"/></svg>连接</div>
        <div class="nav-item" data-page="logs"><svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>日志</div>
      </div>
      <div class="nav-group">
        <div class="nav-title">可视化</div>
        <div class="nav-item" data-page="topology"><svg viewBox="0 0 24 24"><path d="M4 6c6 0 6 6 12 6M4 12h16M4 18c6 0 6-6 12-6"/><circle cx="20" cy="12" r="1.6"/></svg>拓扑</div>
        <div class="nav-item" data-page="routemap"><svg viewBox="0 0 24 24"><path d="M9 4L3 6.5v13L9 17l6 2.5 6-2.5v-13L15 6.5 9 4z"/><path d="M9 4v13M15 6.5v13"/></svg>路由地图</div>
      </div>
      <div class="nav-group">
        <div class="nav-title">代理</div>
        <div class="nav-item" data-page="proxies"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3.5 9.5h17M3.5 14.5h17M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>节点</div>
        <div class="nav-item" data-page="rules"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1.3"/><circle cx="4" cy="12" r="1.3"/><circle cx="4" cy="18" r="1.3"/></svg>规则</div>
        <div class="nav-item" data-page="providers"><svg viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>提供者</div>
      </div>
      <div class="nav-group">
        <div class="nav-title">配置</div>
        <div class="nav-item" data-page="profiles"><svg viewBox="0 0 24 24"><path d="M4 7l8-4 8 4-8 4-8-4z"/><path d="M4 12l8 4 8-4M4 17l8 4 8-4"/></svg>订阅</div>
        <div class="nav-item" data-page="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></svg>设置</div>
      </div>
    </nav>
    <div class="side-foot">
      <div class="kernel-chip">
        <span class="dot"></span>
        <div style="flex:1"><b>Mihomo 运行中</b><br><span>v1.19.2 · 内存 63 MB</span></div>
      </div>
    </div>
  </aside>

  <!-- ================= 主区 ================= -->
  <div class="main">
    <header class="topbar">
      <h1 id="page-title">仪表盘</h1>
      <div class="spacer"></div>
      <div class="seg" id="mode-seg">
        <button class="seg-item">直连</button>
        <button class="seg-item on">规则</button>
        <button class="seg-item">全局</button>
      </div>
      <button class="icon-btn" title="通知"><svg viewBox="0 0 24 24"><path d="M18 9a6 6 0 0 0-12 0c0 7-2 8-2 8h16s-2-1-2-8"/><path d="M10.3 20a2 2 0 0 0 3.4 0"/></svg></button>
      <button class="icon-btn" id="theme-btn" title="切换主题"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2M12 19.5v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2.5 12h2M19.5 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <div class="win-ctrl">
        <button title="最小化"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
        <button title="最大化"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="1.5"/></svg></button>
        <button class="close" title="关闭"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
    </header>
    <div class="content" id="content">
